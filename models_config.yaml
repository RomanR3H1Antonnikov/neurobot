          внутри картинок (постеры, инфографика), сохраняет облик нескольких персонажей в серии
          работ и может брать за основу видео или ссылку на него. Модель гибко работает с
          разрешением и соотношением сторон, а также позволяет итеративно дорабатывать картинку
          в диалоге.
        model_id: gemini-3-pro-image
        provider: aitunnel
        cost_credits: 20
        cost_usd: 0.02
        enabled: true

      - id: seedream-5
        label: "Seedream 5.0"
        description: >-
          Seedream 5.0 отличается высокой детализацией и реалистичностью изображений, уверенно
          прорабатывает сложные композиции и текстуры. Модель точно следует описаниям, поддерживает
          разнообразные стили и эффективно генерирует как портреты, так и сцены с множеством объектов.
        model_id: seedream-v5
