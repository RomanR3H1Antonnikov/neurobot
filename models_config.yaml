# Конфигурация маршрутизации моделей
# Редактируй этот файл для смены моделей и агрегаторов.
#
# cost_credits — сколько кредитов списывается с пользователя за одну генерацию
# cost_usd     — реальная стоимость у агрегатора (нужна для выбора самого дешёвого)
# provider     — id адаптера: aitunnel | routerai | kie
# enabled      — false чтобы временно отключить модель без удаления из конфига
#
# Бот автоматически выбирает модель с минимальным cost_usd среди enabled: true

tasks:
  image_generation:
    cost_credits: 10
    rate_limit_per_hour: 20
    models:
      - id: flux-1-schnell
        provider: aitunnel
        cost_usd: 0.003
        enabled: true
      - id: sdxl-turbo
        provider: routerai
        cost_usd: 0.002
        enabled: false  # включи после получения ключей routerai

  video_generation:
    cost_credits: 50
    rate_limit_per_hour: 5
    models:
      - id: wan2.1-t2v-14b
        provider: aitunnel
        cost_usd: 0.05
        enabled: true
      - id: kling-v1
        provider: kie
        cost_usd: 0.04
        enabled: false  # включи после получения ключей kie

  audio_generation:
    cost_credits: 15
    rate_limit_per_hour: 10
    models:
      - id: tts-1
        provider: aitunnel
        cost_usd: 0.015
        enabled: true

  image_edit:
    cost_credits: 12
    rate_limit_per_hour: 15
    models:
      - id: gpt-image-1
        provider: aitunnel
        cost_usd: 0.04
        enabled: true

  chat:
    cost_credits: 1
    rate_limit_per_hour: 100
    models:
      - id: gpt-4o-mini
        provider: aitunnel
        cost_usd: 0.0002
        enabled: true

  document:
    cost_credits: 5
    rate_limit_per_hour: 30
    models:
      - id: gpt-4o-mini
        provider: aitunnel
        cost_usd: 0.001
        enabled: true
