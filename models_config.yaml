          Midjourney славится высокой художественной выразительностью и умением создавать
          детализированные, кинематографичные изображения. Нейросеть отлично интерпретирует
          текстовые описания, включая сложные стили и атмосферные эффекты. Популярна среди
          художников и дизайнеров благодаря уникальному визуальному стилю и гибкости настроек.
        model_id: midjourney
        provider: genapi
        cost_credits: 25
        cost_usd: 0.04
        enabled: true

      - id: flux-2-flex
        label: "Flux 2 Flex"
        group: flux-2
        group_label: "Flux 2"
        description: >-
          Flux 2 отличается высокой детализацией и реалистичностью изображений, хорошо передаёт
          сложные текстуры и освещение. Модель точно следует описаниям, включая нестандартные
          композиции и стили. Поддерживает широкий спектр направлений — от фотореализма до
          цифровой живописи. Эффективно работает с анатомией и мелкими деталями, снижая число
          артефактов.
        model_id: flux-2-flex
        provider: kie
