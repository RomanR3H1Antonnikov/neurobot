      - id: nano-banana-2
        label: "Nano Banana 2"
        group: nano-banana
        group_label: "Nano Banana AI"
        description: >-
          Nano Banana быстро генерирует и редактирует изображения, отлично справляется с текстом
          внутри картинок (постеры, инфографика), сохраняет облик нескольких персонажей в серии
          работ и может брать за основу видео или ссылку на него. Модель гибко работает с
          разрешением и соотношением сторон, а также позволяет итеративно дорабатывать картинку
          в диалоге.
        model_id: nano-banana-2
        provider: kie
        cost_credits: 15
        cost_usd: 0.01
        enabled: true

      - id: nano-banana-pro
        label: "Nano Banana Pro"
