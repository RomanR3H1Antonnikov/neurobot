# Конфигурация моделей нейросети
# Редактируй этот файл для управления моделями — перезапустить бота после правок.
#
# Поля модели:
#   id            — уникальный slug (латиница, дефисы). Используется внутри бота.
#   label         — название, которое видит пользователь в меню
#   description   — краткое описание (оставь пустым "", чтобы не показывать)
#   model_id      — реальное имя модели, передаваемое в API агрегатора
#   provider      — адаптер: aitunnel | routerai | kie | genapi | polzaai | bratuha | ranvikapi
#   cost_credits  — сколько кредитов списывается с пользователя за один запрос
#   cost_usd      — реальная стоимость у агрегатора (справочно, для сортировки)
#   enabled       — false чтобы временно отключить модель без удаления строки
#   audio_type    — (только для аудио) voice | music

